<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HM310P</title>
    <link rel="stylesheet" type="text/css" href="node_modules/dseg/css/dseg.css">
    <link rel="stylesheet" type="text/css" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="darkly/bootstrap.min.css">

    <style>
        .segment {
            color: #ff0000;
            font-family: DSEG7-Classic-MINI, monospace;
            font-size: 72px;
            text-shadow: 0 0 12px rgba(255, 0, 0, 0.7);
        }

        .input-group-text {
            width: 56px;
            justify-content: center;
        }
        .memory {
            width: 100%;
        }

        #alert {
            position: fixed;
            top: 10px;
            right: 10px;
            left: 10px;
            z-index: 1050;
        }
        
        #chart {
            width: 100%;
            background-color: #222;
        }
        
        .badge-danger {
            background-color: #e74c3c;
        }
    </style>
</head>
<body class="text-light">
<div class="container py-3">
    <div class="row mb-2" style="font-size: 24px">
        <div class="col-4 text-center">Voltage</div>
        <div class="col-4 text-center">Current</div>
        <div class="col-4 text-center">Power</div>
    </div>
    <div class="row mb-3">
        <div class="col-4"><div id="voltageGauge"></div></div>
        <div class="col-4"><div id="currentGauge"></div></div>
        <div class="col-4"><div id="powerGauge"></div></div>
    </div>
    <div class="row mb-4 align-items-baseline">
        <div class="col-4 text-center">
            <span id="dVoltage" class="segment">0.00</span><span class="ms-1 h4">V</span>
        </div>
        <div class="col-4 text-center">
            <span id="dCurrent" class="segment">0.000</span><span class="ms-1 h4">A</span>
        </div>
        <div class="col-4 text-center">
            <span id="dPower" class="segment">0.000</span><span class="ms-1 h4">W</span>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="input-group">
                <span id="cv" class="input-group-text bg-secondary border-secondary text-white">CV</span>
                <input class="form-control write" type="number" id="setVoltage" min="0" max="32" step="0.01">
                <span class="input-group-text bg-dark border-secondary text-white">V</span>
            </div>
        </div>
        <div class="col-4">
            <div class="input-group">
                <span id="cc" class="input-group-text bg-secondary border-secondary text-white">CC</span>
                <input class="form-control write" type="number" id="setCurrent" min="0" max="10" step="0.001">
                <span class="input-group-text bg-dark border-secondary text-white">A</span>
            </div>
        </div>
        <div class="col-4 text-center">
            <button id="powerSwitch" class="btn btn-secondary w-100 py-2"><i class="fa fa-power-off me-2"></i> Power</button>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12 text-end">
            <span id="ovp" class="badge rounded-pill badge-danger mx-1" style="display:none">OVP</span>
            <span id="ocp" class="badge rounded-pill badge-danger mx-1" style="display:none">OCP</span>
            <span id="opp" class="badge rounded-pill badge-danger mx-1" style="display:none">OPP</span>
            <span id="otp" class="badge rounded-pill badge-danger mx-1" style="display:none">OTP</span>
            <span id="scp" class="badge rounded-pill badge-danger mx-1" style="display:none">SCP</span>
        </div>
    </div>

    <div class="row g-2 mb-2">
        <div class="col-2"><input id="m1" class="btn btn-sm btn-primary memory w-100" type="button" value="M1"></div>
        <div class="col-2"><input id="m2" class="btn btn-sm btn-primary memory w-100" type="button" value="M2"></div>
        <div class="col-2"><input id="m3" class="btn btn-sm btn-primary memory w-100" type="button" value="M3"></div>
        <div class="col-2"><input id="m4" class="btn btn-sm btn-primary memory w-100" type="button" value="M4"></div>
        <div class="col-2"><input id="m5" class="btn btn-sm btn-primary memory w-100" type="button" value="M5"></div>
        <div class="col-2"><input id="m6" class="btn btn-sm btn-primary memory w-100" type="button" value="M6"></div>
    </div>

    <div class="row g-2 mb-2">
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m1Voltage" type="number" class="form-control write" step="0.01">
                <span class="input-group-text px-1">V</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m2Voltage" type="number" class="form-control write" step="0.01">
                <span class="input-group-text px-1">V</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m3Voltage" type="number" class="form-control write" step="0.01">
                <span class="input-group-text px-1">V</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m4Voltage" type="number" class="form-control write" step="0.01">
                <span class="input-group-text px-1">V</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m5Voltage" type="number" class="form-control write" step="0.01">
                <span class="input-group-text px-1">V</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m6Voltage" type="number" class="form-control write" step="0.01">
                <span class="input-group-text px-1">V</span>
            </div>
        </div>
    </div>
    
    <div class="row g-2 mb-4">
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m1Current" type="number" class="form-control write" step="0.001">
                <span class="input-group-text px-1">A</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m2Current" type="number" class="form-control write" step="0.001">
                <span class="input-group-text px-1">A</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m3Current" type="number" class="form-control write" step="0.001">
                <span class="input-group-text px-1">A</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m4Current" type="number" class="form-control write" step="0.001">
                <span class="input-group-text px-1">A</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m5Current" type="number" class="form-control write" step="0.001">
                <span class="input-group-text px-1">A</span>
            </div>
        </div>
        <div class="col-2">
            <div class="input-group input-group-sm">
                <input id="m6Current" type="number" class="form-control write" step="0.001">
                <span class="input-group-text px-1">A</span>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div id="chart"></div>
        </div>
    </div>
</div>

<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="node_modules/highcharts/highcharts.js"></script>
<script src="node_modules/highcharts/highcharts-more.js"></script>
<script src="node_modules/highcharts/themes/gray.js"></script>
<script type="module" src="renderer.js"></script>

</body>
</html>
