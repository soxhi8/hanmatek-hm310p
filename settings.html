<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HM310P Settings</title>
    <link rel="stylesheet" href="darkly/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <div class="mb-3">
                <label for="port" class="form-label">Serial Port</label>
                <input id="port" type="text" class="form-control" placeholder="/dev/ttyUSB0 or COM3">
                <div class="form-text text-light-50">Enter the device path for your Hanmatek HM310P.</div>
            </div>
        </div>
    </div>
</div>

<div class="footer fixed-bottom text-end p-3 bg-dark border-top border-secondary">
    <button type="button" class="btn btn-primary px-4" id="close">Save & Close</button>
</div>

<script type="module" src="settings.js"></script>
</body>
</html>
