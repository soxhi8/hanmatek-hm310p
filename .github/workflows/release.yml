name: Release

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: linux
                      build_command: bun x electron-builder --publish never --linux AppImage deb tar.gz rpm
                      allow_failure: false
                    - os: ubuntu-latest
                      artifact_name: pacman
                      build_command: bun x electron-builder --publish never --linux pacman
                      allow_failure: true
                    - os: ubuntu-latest
                      artifact_name: flatpak
                      build_command: bun x electron-builder --publish never --linux flatpak
                      allow_failure: false
                    - os: windows-latest
                      artifact_name: windows
                      build_command: bun x electron-builder --publish never --win nsis portable
                      allow_failure: false
                    - os: macos-latest
                      artifact_name: macos
                      build_command: bun x electron-builder --publish never --mac dmg zip
                      allow_failure: false

        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.allow_failure }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Export Python for node-gyp on Linux and macOS
              if: runner.os != 'Windows'
              run: |
                  echo "PYTHON=${pythonLocation}/bin/python" >> "$GITHUB_ENV"
                  echo "npm_config_python=${pythonLocation}/bin/python" >> "$GITHUB_ENV"

            - name: Export Python for node-gyp on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  "PYTHON=$env:pythonLocation\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "npm_config_python=$env:pythonLocation\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Install Linux packaging dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder libarchive-tools rpm

            - name: Set up Flatpak runtime dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
                  sudo flatpak install -y flathub \
                    org.freedesktop.Platform//23.08 \
                    org.freedesktop.Sdk//23.08 \
                    org.electronjs.Electron2.BaseApp//23.08

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Install Electron app dependencies
              run: bun x electron-builder install-app-deps

            - name: Build release artifacts
              env:
                  DEBUG: electron-builder,@malept/flatpak-bundler*
                  DEBUG_COLORS: '0'
              run: ${{ matrix.build_command }}

            - name: Upload release artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: dist-${{ matrix.artifact_name }}
                  path: dist/**
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v6
              with:
                  path: release-assets

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --verify-tag \
                    --generate-notes

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mapfile -t assets < <(
                    find release-assets -type f \
                      ! -name 'elevate.exe' \
                      ! -path '*/win-unpacked/*' \
                      ! -path '*/linux-unpacked/*' \
                      ! -path '*/mac/*' \
                      \( \
                        -name '*.AppImage' -o \
                        -name '*.deb' -o \
                        -name '*.rpm' -o \
                        -name '*.pacman' -o \
                        -name '*.flatpak' -o \
                        -name '*.dmg' -o \
                        -name '*.zip' -o \
                        -name '*.exe' -o \
                        -name '*.tar.gz' \
                      \)
                  )

                  if [ "${#assets[@]}" -eq 0 ]; then
                    echo "No release assets found"
                    exit 1
                  fi

                  gh release upload "${GITHUB_REF_NAME}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --clobber \
                    "${assets[@]}"
